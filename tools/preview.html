<!doctype html>
<!-- Bancada do mw-tab-card: roda no navegador, sem Home Assistant.
     As variações vêm de tools/bench-stubs.js (as mesmas que viram as fotos do
     README), então bancada e README nunca discordam. -->
<html lang="pt-BR"><head><meta charset="utf-8"><title>MW Tab Card — bancada</title>
<style>
  :root{ --card-background-color:#1c2230; --primary-text-color:#e8eef7;
         --secondary-text-color:#93a4bb; --ha-card-border-radius:16px; --divider-color:#38415a; }
  body{margin:0;background:#14171e;font:14px/1.45 'Graphik',system-ui,-apple-system,sans-serif;
       padding:24px;color:#fff}
  h1{font:700 15px/1 system-ui;letter-spacing:.14em;text-transform:uppercase;color:#ffd7e2;margin:0 0 22px}
  .grid{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
  .item{display:flex;flex-direction:column;gap:10px}
  .cap{font:600 11px/1.3 system-ui;letter-spacing:.1em;text-transform:uppercase;
       color:#8a93a8;text-align:center}
</style></head><body>
<h1>MW Tab Card — bancada</h1>
<div class="grid" id="grid"></div>
<script src="bench-stubs.js"></script>
<script src="../dist/mw-tab-card.js"></script>
<script>
  const grid = document.getElementById("grid");
  for (const [name, c] of Object.entries(window.MW_CASES)) {
    const item = document.createElement("div");
    item.className = "item";
    item.style.width = c.width + "px";
    const card = document.createElement("mw-tab-card");
    card.setConfig(JSON.parse(JSON.stringify(c.cfg)));
    card.hass = { states: {}, callService() {} };
    const cap = document.createElement("div");
    cap.className = "cap";
    cap.textContent = `${c.title}  ·  #${name}`;
    item.append(card, cap);
    grid.appendChild(item);
  }
</script>
</body></html>
